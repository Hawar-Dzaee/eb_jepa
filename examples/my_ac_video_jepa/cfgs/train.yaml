logging:
  log_wandb: true 
  wandb_group:
  wandb_sweep:
  log_every: 10
  exp_suffix: 26-07-20
  save_every_n_epochs: 1
  tqdm_silent: false 
meta:
  model_folder:
  load_model: true
  enable_plan_eval: true 
  eval_every_itr: -1
  seed: 1

data:
  env_name: two_rooms
  # Training-specific overrides (base config in eb_jepa/datasets/two_rooms/data_config.yaml)
  batch_size: 384
  num_workers: 16
  pin_mem: true
  persistent_workers: true
training:
  use_amp: true
  dtype: bfloat16
model:
  compile: true
  dobs: 2
  henc: 32
  hpre: 32
  dstc: 32
  nsteps: 8
  regularizer:
    cov_coeff: 8
    std_coeff: 16 # 4.0
    sim_coeff_t: 12 # 0.75 in PLDM
    idm_coeff: 1 
    first_t_only: False
    spatial_as_samples: false
    use_proj: false
    idm_after_proj: false
    sim_t_after_proj: false 

optim:
  epochs: 12 
  lr: 0.001
  grad_clip_enc: 2.0
  grad_clip_pred: 2.0
  weight_decay: 1.e-5
eval:
  plan_cfg_path: cfgs/planning_mppi.yaml 