# ============================================================================
# EB-JEPA Glossary — examples/image_jepa
# ============================================================================
# What does each term mean, and what role does it play?
# Categories: architecture, loss, optimizer, scheduler, augmentation,
#             evaluation, training-utility, dataset, config-key
# ============================================================================

# ── Core architecture ────────────────────────────────────────────────────────

JEPA:
  stands_for: Joint-Embedding Predictive Architecture
  category: architecture
  summary: >
    Self-supervised framework that learns representations by predicting
    the latent embedding of a target view from a context view,
    without reconstructing raw pixels.

ImageSSL:
  stands_for: Image Self-Supervised Learning
  category: architecture
  summary: >
    Wrapper class (examples/image_jepa/main.py) that bundles an encoder
    backbone, an optional projector MLP, and a VICReg/BCS loss into one
    nn.Module for self-supervised pre-training on images.

Encoder:
  category: architecture
  summary: >
    Neural network (ResNet-18, ViT, etc.) that maps a raw image into a
    fixed-size latent representation vector.

Predictor:
  category: architecture
  summary: >
    Network that takes the current latent state (and optionally an action)
    and predicts the next latent state.

Projector:
  category: architecture
  summary: >
    Small MLP appended after the encoder. Maps representations to the
    space where the loss is computed. Prevents dimensional collapse and
    improves downstream accuracy (~2-3 points on CIFAR-10).

Backbone:
  category: architecture
  summary: >
    The main feature-extraction network (e.g. ResNet-18, ViT-S).
    "Backbone" just means the trunk of the model before any projection
    or classification head.

VisionTransformer:
  stands_for: Vision Transformer (ViT)
  category: architecture
  summary: >
    Splits an image into fixed-size patches, linearly embeds them, and
    processes the sequence with a standard Transformer encoder.
    Variants: ViT-S (small), ViT-B (base).

patch_size:
  category: config-key
  summary: >
    Side length (in pixels) of each square patch fed to a ViT.
    Smaller patches = more tokens = higher cost but finer detail.

# ── Loss functions & regularisation ──────────────────────────────────────────

VICReg:
  stands_for: Variance-Invariance-Covariance Regularisation
  category: loss
  summary: >
    Three-term loss that prevents representation collapse:
      1. Invariance — MSE between the two augmented views (pull them together).
      2. Variance  — hinge loss keeping per-feature std above a margin
                     (prevents all features collapsing to a constant).
      3. Covariance — penalises off-diagonal covariance entries
                     (decorrelates features so they carry different info).

BCS:
  stands_for: Batched Characteristic Slicing
  category: loss
  summary: >
    Alternative regulariser (used by SIGReg configs). Tests whether
    the embedding distribution is Gaussian via characteristic-function
    slicing. More robust to hyperparameter choices than VICReg.

SIGReg:
  stands_for: Signature-based Regularisation
  category: loss
  summary: >
    Regularisation strategy that uses the BCS loss.
    See examples/image_jepa/cfgs/sigreg.yaml.

HingeStdLoss:
  category: loss
  summary: >
    Penalises any feature whose standard deviation drops below a
    margin (default 1.0). Prevents "feature death" where individual
    dimensions go flat.

CovarianceLoss:
  category: loss
  summary: >
    Minimises the off-diagonal entries of the feature covariance matrix,
    encouraging each dimension to encode independent information.

InvariantLoss:
  category: loss
  summary: >
    Plain MSE between the representations of two augmented views of the
    same image. Pulls them together in embedding space.

RepresentationCollapse:
  category: concept
  summary: >
    Failure mode where the encoder maps every input to the same (or
    nearly the same) vector. VICReg's variance + covariance terms exist
    specifically to prevent this.

# ── Optimisers ───────────────────────────────────────────────────────────────

LARS:
  stands_for: Layer-wise Adaptive Rate Scaling
  category: optimizer
  summary: >
    Scales the learning rate independently for each layer based on the
    ratio of weight norm to gradient norm. Stabilises training for large
    batch sizes. Used in examples/image_jepa/main.py.

AdamW:
  category: optimizer
  summary: >
    Adam optimiser with decoupled weight decay. Standard choice for
    Transformer-based training.

weight_decay:
  category: config-key
  summary: >
    L2 regularisation coefficient applied to model weights.
    Prevents overfitting by penalising large weights.

# ── Schedulers ───────────────────────────────────────────────────────────────

CosineWithWarmup:
  category: scheduler
  summary: >
    Learning-rate schedule that linearly ramps up during a warmup phase,
    then decays following a cosine curve down to min_lr.

warmup_epochs:
  category: config-key
  summary: Number of epochs over which the learning rate linearly increases.

warmup_start_lr:
  category: config-key
  summary: Learning rate at the very start of warmup (before ramp-up).

min_lr:
  category: config-key
  summary: Floor learning rate at the end of cosine annealing.

# ── Data augmentation ────────────────────────────────────────────────────────

RandomResizedCrop:
  category: augmentation
  summary: >
    Crops a random rectangle from the image (random area & aspect ratio),
    then resizes it to the target resolution.

ColorJitter:
  category: augmentation
  summary: >
    Randomly perturbs brightness, contrast, saturation, and hue.

Solarization:
  category: augmentation
  summary: >
    Inverts pixel values above a threshold, creating a partial-negative
    effect. Common in SSL pipelines (BYOL, DINO, VICReg).

num_crops:
  category: config-key
  summary: >
    Number of augmented views generated per image. Typically 2 — the loss
    compares these two views to learn augmentation-invariant features.

# ── Evaluation ───────────────────────────────────────────────────────────────

LinearProbe:
  category: evaluation
  summary: >
    Standard SSL evaluation protocol: freeze the encoder, train a single
    linear layer (logistic regression) on top. The classification accuracy
    measures how useful the learned representations are.

# ── Training utilities ───────────────────────────────────────────────────────

AMP:
  stands_for: Automatic Mixed Precision
  category: training-utility
  summary: >
    Runs forward passes in float16/bfloat16 and keeps master weights in
    float32. Cuts memory use and speeds up training on modern GPUs.

GradScaler:
  category: training-utility
  summary: >
    Scales the loss before backward() to prevent float16 gradients from
    underflowing. Paired with AMP.

bfloat16:
  stands_for: Brain Floating Point 16
  category: training-utility
  summary: >
    16-bit format with the same exponent range as float32 but less
    mantissa precision. More numerically stable than float16 — preferred
    when hardware supports it.

EMA:
  stands_for: Exponential Moving Average
  category: training-utility
  summary: >
    Maintains a slow-moving copy of model weights (target encoder) by
    blending new weights with old ones each step. Common in SSL methods
    like BYOL and DINO to stabilise training targets.

wandb:
  stands_for: Weights & Biases
  category: training-utility
  summary: >
    Third-party experiment-tracking platform. Logs metrics, configs,
    and artifacts so you can compare runs in a dashboard.

# ── Datasets ─────────────────────────────────────────────────────────────────

CIFAR-10:
  category: dataset
  summary: >
    60 000 tiny (32x32) colour images in 10 classes. Used here as a
    lightweight benchmark for image JEPA pre-training and linear probing.
